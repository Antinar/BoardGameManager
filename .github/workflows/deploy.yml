name: Subida Automatica a InfinityFree
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: Desplegar por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Generar configuracion segura desde GitHub Secrets
        run: |
          cat << 'EOF' > smtp_config.php
          <?php
          // Credenciales de Base de Datos (reutilizando los secretos de InfinityFree)
          define('DB_HOST', 'sql209.infinityfree.com');
          define('DB_NAME', '${{ secrets.FTP_USERNAME }}_gatarras');
          define('DB_USER', '${{ secrets.FTP_USERNAME }}');
          define('DB_PASS', '${{ secrets.FTP_PASSWORD }}');

          // Credenciales SMTP
          define('SMTP_HOST', 'smtp.gmail.com');
          define('SMTP_PORT', 587);
          define('SMTP_USER', '${{ secrets.SMTP_USER }}');
          define('SMTP_PASS', '${{ secrets.SMTP_PASS }}');
          define('SMTP_FROM', '${{ secrets.SMTP_USER }}');
          define('SMTP_FROM_NAME', 'La Taberna de las Gatitas Jugonas');
          EOF

      - name: Sincronizar archivos con InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude:
          **/.git*
            **/.git*/**
            sql/**
            README.md
